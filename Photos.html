    <section class="toy-gallery">

        <!-- Gallery Introduction -->
        <div class="gallery-intro">

            <div>
                <h1>My toy gallery</h1>

                <p>
                    I uploaded the photos I took for my toys
                    on the website as a souvenir.
                </p>
            </div>

            <div class="gallery-buttons">

                <a href="#gallery" class="purple-btn">
                    go! <span>➜</span>
                </a>

                <a href="#more-info" class="grey-btn">
                    More info<span>?</span>
                </a>

            </div>

        </div>


        <!-- Three Photo Cards -->
        <div class="gallery-grid" id="gallery">

            <!-- Photo 1 -->
            <div class="toy-card">

                <div class="image fit">
                   <img src="images/rei-sunshine.jpg" alt="Rei-Sunshine" />
                </div>

                <h3>Sunshine</h3>
                <p>
                    Filmed in York.
                </p>
            </div>
            


            <!-- Photo 2 -->
            <div class="toy-card">

                <div class="image fit">
                    <img src="images/rei-eat.jpg" alt="Rei-Eat" />
                </div>

                <h3>Eat it up</h3>

                <p>
                    Filmed in Shanghai.
                </p>

            </div>


            <!-- Photo 3 -->
            <div class="toy-card">

                <div class="image fit">
                    <img src="images/rei-cake.jpg" alt="Rei-Cake" />
                </div>

                <h3>Cake</h3>

                <p>
                    Filmed in my birthday.
                </p>

            </div>

        </div>

        <div id="more-info"></div>
